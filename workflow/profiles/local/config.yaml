snakefile: workflow/Snakefile
cores: 48
printshellcmds: true
show-failed-logs: true
keep-going: false
rerun-incomplete: true
latency-wait: 30
use-conda: false
use-apptainer: true
apptainer-args: "--cleanenv --unsquash --bind /home/vebaev/codex:/home/vebaev/codex"
default-resources:
  - mem_mb=4000
  - runtime=60
  - tmpdir="/home/vebaev/codex/.tmp"
resources:
  - mem_mb=178000
