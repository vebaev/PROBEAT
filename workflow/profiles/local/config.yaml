snakefile: workflow/Snakefile
cores: 48
printshellcmds: true
show-failed-logs: true
keep-going: false
rerun-incomplete: true
latency-wait: 30
use-conda: true
conda-prefix: snakemake_conda_envs
use-apptainer: false
default-resources:
  - mem_mb=4000
  - runtime=60
  - tmpdir=".tmp"
resources:
  - mem_mb=178000
